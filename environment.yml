name: thesis-testing

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.10.20
  - pip
  - cmake
  - ninja
  - cxx-compiler
  - pip:
      # Exact tested builds are not all available through Conda on every platform.
      - numpy==1.26.4
      - scipy==1.15.3
      - matplotlib==3.10.9
      - torch==2.10.0
      - gymnasium==1.3.0
      - pyyaml==6.0.3
      - pytest==8.4.2
      - setuptools==80.10.2
      - evogym==2.0.0
